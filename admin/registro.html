<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar barbería | TurnoYa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<main class="acceso">
  <div class="acceso__caja pila-g">
    <a class="logo" href="../index.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg> TurnoYa</a>
    <div class="pila">
      <h1>Registra tu barbería</h1>
      <p class="apoyo">Crea tu cuenta y comparte el enlace de reservas con tus clientes.</p>
    </div>
    <form action="panel.html" method="get" class="tarjeta pila">
      <div class="campo">
        <label for="negocio">Nombre de la barbería</label>
        <input class="entrada" id="negocio" type="text" autocomplete="organization" minlength="3" required aria-describedby="negocio-error">
        <p class="campo__error" id="negocio-error">Escribe el nombre de la barbería.</p>
      </div>
      <div class="campo">
        <label for="dueno">Tu nombre</label>
        <input class="entrada" id="dueno" type="text" autocomplete="name" minlength="3" required aria-describedby="dueno-error">
        <p class="campo__error" id="dueno-error">Escribe tu nombre.</p>
      </div>
      <div class="campo">
        <label for="correo-r">Correo</label>
        <input class="entrada" id="correo-r" type="email" autocomplete="email" required aria-describedby="correo-r-error">
        <p class="campo__error" id="correo-r-error">Escribe un correo válido.</p>
      </div>
      <div class="campo">
        <label for="clave-r">Contraseña</label>
        <input class="entrada" id="clave-r" type="password" autocomplete="new-password" minlength="8" required aria-describedby="clave-r-ayuda clave-r-error">
        <p class="campo__ayuda" id="clave-r-ayuda">Mínimo 8 caracteres.</p>
        <p class="campo__error" id="clave-r-error">La contraseña debe tener al menos 8 caracteres.</p>
      </div>
      <button class="btn btn--primario btn--bloque" type="submit">Crear cuenta</button>
    </form>
    <p class="apoyo" style="text-align:center">¿Ya tienes cuenta? <a class="enlace-tactil" href="login.html">Ingresa</a></p>
  </div>
</main>
</body>
</html>
