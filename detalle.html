<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu reserva | TurnoYa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="barra">
  <a class="logo" href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg> TurnoYa</a>
  <a class="enlace-barra" href="mis-reservas.html">Mis reservas</a>
</header>
<main id="contenido" class="contenedor pila">
<a class="volver" href="mis-reservas.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Volver</a>
<h1>Tu reserva</h1>
<span class="codigo" style="font-size:var(--t-2xl)">A7K2P9</span>
<dl class="tarjeta resumen" style="margin:0">
  <div><dt><span class="icono-azul"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg></span> Servicio</dt><dd>Corte clásico</dd></div>
  <div><dt><span class="icono-azul"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span> Barbero</dt><dd>Camilo Ríos</dd></div>
  <div><dt><span class="icono-azul"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span> Fecha</dt><dd>Jueves 12 de noviembre</dd></div>
  <div><dt><span class="icono-azul"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span> Hora</dt><dd>9:00 a. m.</dd></div>
  <div><dt><span class="icono-azul"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/></svg></span> Precio</dt><dd>$18.000</dd></div>
</dl>
<button class="btn btn--peligro btn--bloque" type="button" popovertarget="confirmar-cancelacion">Cancelar reserva</button>
<div class="dialogo pila" id="confirmar-cancelacion" popover role="alertdialog" aria-labelledby="dialogo-titulo">
  <h2 id="dialogo-titulo">¿Cancelar esta reserva?</h2>
  <p class="apoyo">El turno del jueves 12 de noviembre quedará libre para otra persona.</p>
  <div class="acciones">
    <a class="btn btn--peligro" href="cancelada.html">Sí, cancelar</a>
    <button class="btn btn--secundario" type="button" popovertarget="confirmar-cancelacion" popovertargetaction="hide">No</button>
  </div>
</div>
</main>
</body>
</html>
