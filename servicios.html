<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escoge el servicio | TurnoYa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="barra">
  <a class="logo" href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg> TurnoYa</a>
  <a class="enlace-barra" href="mis-reservas.html">Mis reservas</a>
</header>
<main id="contenido" class="contenedor pila">
<a class="volver" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Volver</a>
<div class="pasos">
  <p class="pasos__texto">Paso 1 de 5</p>
  <div class="pasos__barra" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1" aria-label="Avance de la reserva"><span class="pasos__avance" style="width:20%"></span></div>
</div>
<form action="barberos.html" method="get">
  <fieldset class="pila">
    <legend><h1>¿Qué servicio quieres?</h1></legend>
    <div class="rejilla rejilla--2">
      <label class="opcion">
        <input class="requiere-seleccion" type="radio" name="servicio" value="corte" required>
        <span class="opcion__caja">
          <span class="opcion__texto">
            <span class="opcion__nombre">Corte clásico</span>
            <span class="opcion__fila"><span class="precio">$18.000</span><span class="duracion"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 30 min</span></span>
          </span>
          <span class="marca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></span>
        </span>
      </label>
      <label class="opcion">
        <input class="requiere-seleccion" type="radio" name="servicio" value="barba" required>
        <span class="opcion__caja">
          <span class="opcion__texto">
            <span class="opcion__nombre">Barba</span>
            <span class="opcion__fila"><span class="precio">$12.000</span><span class="duracion"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 20 min</span></span>
          </span>
          <span class="marca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></span>
        </span>
      </label>
      <label class="opcion">
        <input class="requiere-seleccion" type="radio" name="servicio" value="combo" required>
        <span class="opcion__caja">
          <span class="opcion__texto">
            <span class="opcion__nombre">Corte + barba</span>
            <span class="opcion__fila"><span class="precio">$28.000</span><span class="duracion"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 45 min</span></span>
          </span>
          <span class="marca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></span>
        </span>
      </label>
      <label class="opcion">
        <input class="requiere-seleccion" type="radio" name="servicio" value="cejas" required>
        <span class="opcion__caja">
          <span class="opcion__texto">
            <span class="opcion__nombre">Cejas</span>
            <span class="opcion__fila"><span class="precio">$6.000</span><span class="duracion"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 10 min</span></span>
          </span>
          <span class="marca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></span>
        </span>
      </label>
    </div>
  </fieldset>
  <div class="accion"><button class="btn btn--primario btn--bloque" type="submit">Continuar</button></div>
</form>
</main>
</body>
</html>
