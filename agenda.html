<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elige la hora | TurnoYa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="barra">
  <a class="logo" href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg> TurnoYa</a>
  <a class="enlace-barra" href="mis-reservas.html">Mis reservas</a>
</header>
<main id="contenido" class="contenedor pila">
<a class="volver" href="barberos.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Volver</a>
<div class="pasos">
  <p class="pasos__texto">Paso 3 de 5</p>
  <div class="pasos__barra" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="3" aria-label="Avance de la reserva"><span class="pasos__avance" style="width:60%"></span></div>
</div>
<form action="datos.html" method="get" class="pila">
  <h1>¿Cuándo te queda bien?</h1>
  <fieldset>
    <legend class="sr">Día de la cita, noviembre de 2026</legend>
    <p class="pequeno">Noviembre de 2026. Desliza para ver más días.</p>
    <div class="dias">
      <label class="dia"><input type="radio" name="dia" value="9" aria-label="lunes 9 de noviembre"><span>L<b>9</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="10" aria-label="martes 10 de noviembre"><span>M<b>10</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="11" aria-label="miércoles 11 de noviembre"><span>M<b>11</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="12" aria-label="jueves 12 de noviembre" checked><span>J<b>12</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="13" aria-label="viernes 13 de noviembre"><span>V<b>13</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="14" aria-label="sábado 14 de noviembre"><span>S<b>14</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="16" aria-label="lunes 16 de noviembre"><span>L<b>16</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="17" aria-label="martes 17 de noviembre"><span>M<b>17</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="18" aria-label="miércoles 18 de noviembre"><span>M<b>18</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="19" aria-label="jueves 19 de noviembre"><span>J<b>19</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="20" aria-label="viernes 20 de noviembre"><span>V<b>20</b></span></label>
      <label class="dia"><input type="radio" name="dia" value="21" aria-label="sábado 21 de noviembre"><span>S<b>21</b></span></label>
    </div>
  </fieldset>
  <fieldset>
    <legend><h2>Horarios disponibles</h2></legend>
    <div class="horas" style="margin-top:var(--e-3)">
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="08:00" required><span>08:00</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="08:30" disabled><span>08:30<span class="sr"> ocupado</span></span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="09:00" required><span>09:00</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="09:30" required><span>09:30</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="10:00" disabled><span>10:00<span class="sr"> ocupado</span></span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="10:30" disabled><span>10:30<span class="sr"> ocupado</span></span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="11:00" required><span>11:00</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="11:30" required><span>11:30</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="14:00" disabled><span>14:00<span class="sr"> ocupado</span></span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="14:30" required><span>14:30</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="15:00" disabled><span>15:00<span class="sr"> ocupado</span></span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="15:30" required><span>15:30</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="16:00" required><span>16:00</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="16:30" required><span>16:30</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="17:00" required><span>17:00</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="17:30" disabled><span>17:30<span class="sr"> ocupado</span></span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="18:00" required><span>18:00</span></label>
      <label class="hora"><input class="requiere-seleccion" type="radio" name="hora" value="18:30" required><span>18:30</span></label>
    </div>
  </fieldset>
  <ul class="leyenda">
    <li><span class="muestra muestra--libre"></span> Libre</li>
    <li><span class="muestra muestra--ocupado"></span> Ocupado</li>
    <li><span class="muestra muestra--elegido"></span> Tu elección</li>
  </ul>
  <div class="accion"><button class="btn btn--primario btn--bloque" type="submit">Continuar</button></div>
</form>
</main>
</body>
</html>
